<title>Training Program</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app shell — sticky header, weekly plan strip, exercise list, bottom tab bar; sheets slide up for detail and workout. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --ink: #1d2321;
  --muted: #5f6a66;
  --line: #d6dbd7;
  --stage: #e3e7e2;
  --push: #d9480f;
  --pull: #1971c2;
  --legs: #9c6b00;
  --accent: var(--push);
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1d2422; --ink: #e9eeeb; --muted: #9aa6a1; --line: #2e3734; --stage: #232b28;
    --push: #ff7a45; --pull: #5aa9f0; --legs: #e0b23a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1d2422; --ink: #e9eeeb; --muted: #9aa6a1; --line: #2e3734; --stage: #232b28;
  --push: #ff7a45; --pull: #5aa9f0; --legs: #e0b23a; color-scheme: dark;
}
body[data-slot="2"] { --accent: var(--pull); }
body[data-slot="3"] { --accent: var(--legs); }

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: inherit; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .95; margin: 2px 0 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--accent); transition: color .3s; }
.summary { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 14px; }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
.progress { flex: 1 1 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; margin-bottom: 12px; }
.plan-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-top: 10px; }
.day { border: 0; border-radius: 8px; padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: var(--stage); color: var(--muted); font-size: 11px; font-weight: 600; min-width: 0; }
.day b { font-family: var(--display); font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: .02em; color: var(--ink); line-height: 1.1; }
.day[data-slot="1"] { box-shadow: inset 0 -3px 0 var(--push); }
.day[data-slot="2"] { box-shadow: inset 0 -3px 0 var(--pull); }
.day[data-slot="3"] { box-shadow: inset 0 -3px 0 var(--legs); }
.day.rest { background: none; border: 1px dashed var(--line); cursor: default; }
.day.rest b { color: var(--muted); }
.day.cur { background: var(--accent); color: #fff; box-shadow: none; }
.day.cur b { color: #fff; }
.plan p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.seg.prog { display: grid; grid-template-columns: 1fr 1fr; width: 100%; margin-bottom: 0; }
.seg.prog button { padding: 7px 8px; font-size: 14px; font-weight: 700; }
.venue-row[hidden] { display: none; }
.venue-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
.plan .prog-note { margin: 6px 2px 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }

.list { display: flex; flex-direction: column; gap: 10px; }
.divider { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding: 0 4px 2px; border-bottom: 2px solid var(--accent); }
.divider b { font-family: var(--display); font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.divider span { font-size: 13px; color: var(--muted); }
.card { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 8px 8px; }
.card .thumb { width: 96px; height: 80px; border-radius: 10px; background: var(--stage); display: block; }
.card .meta { min-width: 0; }
.card h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; }
.card .muscles { font-size: 13px; color: var(--muted); margin-top: 2px; }
.card .dose { font-family: var(--display); font-weight: 700; font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.card .dose small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
.card-open { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; text-align: left; background: none; border: 0; padding: 0; border-radius: 10px; min-width: 0; }
.check { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; padding: 0; display: grid; place-items: center; position: relative; }
.check::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); transition: background .15s, border-color .15s; }
.check:hover::before { border-color: var(--accent); }
.check svg { position: relative; }
.card.done .check::before { background: var(--accent); border-color: var(--accent); }
.confirm[hidden] { display: none; }
.confirm { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgb(0 0 0 / .35); }
.confirm .box { width: 100%; max-width: 520px; background: var(--surface); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  animation: rise .2s ease-out; }
@keyframes rise { from { transform: translateY(30px); opacity: .6; } }
.confirm h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1.05; text-transform: uppercase; text-wrap: balance; }
.confirm p { margin: 6px 0 0; color: var(--muted); }
.confirm .row { display: flex; gap: 10px; margin-top: 18px; }
.confirm .row button { flex: 1; margin: 0; }
.confirm .row .start { font-size: 20px; padding: 14px; }
@media (prefers-reduced-motion: reduce) { .confirm .box { animation: none; } }
.card.done .check { background: var(--accent); border-color: var(--accent); }
.card.done .check svg { opacity: 1; }
.check svg { opacity: 0; stroke: var(--surface); }
.card.done h3 { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--accent); }

.start { margin-top: 16px; width: 100%; border: 0; border-radius: 14px; padding: 16px; background: var(--accent); color: #fff;
  font-family: var(--display); font-weight: 900; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; }
.reset { margin: 10px auto 0; display: block; background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; }
.source { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { background: none; border: 0; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted);
  font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; position: relative; }
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--c); }
nav.tabs button[data-slot="1"] { --c: var(--push); }
nav.tabs button[data-slot="2"] { --c: var(--pull); }
nav.tabs button[data-slot="3"] { --c: var(--legs); }
nav.tabs button[aria-selected="true"] svg { color: var(--c); }

/* Sheets */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet .wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.stage { width: 100%; aspect-ratio: 6 / 5; max-width: 100%; background: var(--stage); border-radius: 18px; display: block; margin-top: 8px; }
.sheet h2 { font-family: var(--display); font-weight: 900; font-size: 38px; line-height: 1; margin: 16px 0 6px; text-transform: uppercase; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.chip.hot { background: var(--accent); border-color: var(--accent); color: #fff; }
.sheet h4 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
ol.steps li::before { content: counter(s); font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--accent); line-height: 1.3; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.note b { font-weight: 700; }
.actions { display: flex; gap: 10px; margin-top: 22px; }
.actions .start { margin: 0; flex: 1; }

/* Workout */
.wk-top { display: flex; align-items: center; gap: 12px; }
.wk-top .progress { flex: 1; }
.wk-count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; font-weight: 600; }
.wk-name { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; text-transform: uppercase; margin: 16px 0 4px; text-wrap: balance; }
.wk-sets { display: flex; gap: 8px; margin-top: 14px; }
.wk-sets span { flex: 1; height: 10px; border-radius: 5px; background: var(--line); }
.wk-sets span.on { background: var(--accent); }
.wk-reps { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.wk-reps b { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
.wk-reps span { color: var(--muted); font-weight: 600; }
.cue { margin-top: 10px; color: var(--muted); }
.wk-row { display: flex; gap: 10px; margin-top: 16px; }
.wk-row .start { margin: 0; flex: 1; }
.rest { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 18px; }
.ring { width: 220px; height: 220px; max-width: 100%; }
.ring text { font-family: var(--display); font-weight: 900; font-size: 60px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.ring .sub { font-family: var(--body); font-size: 14px; font-weight: 600; fill: var(--muted); letter-spacing: .12em; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 18px; font-weight: 700; }
.up-next { font-size: 15px; color: var(--muted); text-align: center; }
.up-next b { color: var(--ink); }
.finish { text-align: center; padding-top: 12vh; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.finish .big { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: .9; text-transform: uppercase; }

/* Figure */
.fig .bone { stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fig .bone.hi { stroke: var(--accent); }
.fig .far { opacity: .35; }
.fig .front .far { opacity: 1; }
.fig .head { fill: var(--ink); }
.fig .prop { stroke: var(--muted); stroke-linecap: round; fill: none; }
.fig .pad { stroke: var(--line); stroke-linecap: round; fill: none; }
.fig .propfill { fill: var(--line); stroke: var(--muted); }
.fig .floor { stroke: var(--line); }
.fig .db { stroke: var(--muted); stroke-linecap: round; }
.fig .cable { stroke: var(--muted); fill: none; }

@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="eyebrow" id="today">Today</div>
    <h1><span id="catTitle">Push</span> Day<span id="dayVar"></span></h1>
    <div class="summary">
      <span><b id="doneCount">0</b> of <b id="totalCount">6</b> done</span>
      <div class="progress" aria-hidden="true"><i id="progBar"></i></div>
      <span id="timeEst">~50 min</span>
    </div>
  </header>

  <section class="plan" aria-label="Weekly plan">
    <div class="seg prog" role="group" aria-label="Program" id="progSeg">
      <button type="button" id="prog-ppl" data-prog="ppl" aria-pressed="true">Men's Program</button>
      <button type="button" id="prog-women" data-prog="women" aria-pressed="false">Women's Program</button>
    </div>
    <div class="venue-row" id="venueRow" hidden>
      <span class="eyebrow">Where you train</span>
      <div class="seg" role="group" aria-label="Where you train">
        <button type="button" id="venue-gym" data-venue="gym" aria-pressed="true">Gym</button>
        <button type="button" id="venue-home" data-venue="home" aria-pressed="false">Home</button>
      </div>
    </div>
    <p class="prog-note" id="progNote"></p>
    <div class="plan-head">
      <span class="eyebrow">Your week</span>
      <div class="seg" role="group" aria-label="Experience level">
        <button type="button" id="lvl-beg" data-lvl="beg" aria-pressed="true">Beginner</button>
        <button type="button" id="lvl-adv" data-lvl="adv" aria-pressed="false">Advanced</button>
      </div>
    </div>
    <div class="days" id="days"></div>
    <p id="planNote"></p>
  </section>

  <main class="list" id="list" aria-live="polite"></main>
  <button class="start" id="startBtn" type="button">Start workout</button>
  <button class="reset" id="resetBtn" type="button">Clear today's checkmarks</button>
  <p class="source" id="source"></p>
</div>

<nav class="tabs" role="tablist" aria-label="Workout type">
  <div class="inner" id="tabs"></div>
</nav>

<section class="sheet" id="detail" aria-modal="true" role="dialog" aria-labelledby="dName">
  <div class="wrap">
    <div class="bar">
      <button class="iconbtn" id="dClose" type="button" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="eyebrow" id="dCat"></span>
      <span style="width:44px"></span>
    </div>
    <svg class="stage fig" id="dFig" viewBox="0 0 240 200" role="img"></svg>
    <h2 id="dName"></h2>
    <div class="chips" id="dChips"></div>
    <h4>How to do it</h4>
    <ol class="steps" id="dSteps"></ol>
    <h4>Form check</h4>
    <div class="note" id="dNote"></div>
    <div class="actions">
      <button class="start" id="dDo" type="button">Do this one</button>
      <button class="ghost" id="dMark" type="button">Mark done</button>
    </div>
  </div>
</section>

<div class="confirm" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cText" hidden>
  <div class="box">
    <h3 id="cTitle"></h3>
    <p id="cText"></p>
    <div class="row">
      <button class="ghost" type="button" id="cNo">Cancel</button>
      <button class="start" type="button" id="cYes"></button>
    </div>
  </div>
</div>

<section class="sheet" id="workout" aria-modal="true" role="dialog" aria-label="Workout">
  <div class="wrap" id="wkWrap"></div>
</section>

<script>
(() => {
// ---------- Exercise library (from Healthline's push-pull routine: 3–4 sets of 8–12 reps, 2–3 min rest) ----------
// Side-view poses: h=hip, s=shoulder, a=hand, f=foot (a2/f2 = far limb, t = toe). Stage is 240x200, floor at y=180.
// front:true = seen from the front; h and s are then body centre points and both arms/legs are drawn.
// e/kn = which side the elbow/knee bends. hi = segments drawn in the accent colour (the working muscles).
const STD = { sets: 3, setsLabel: "3–4", reps: "8–12", rest: 120 };
const EX = {
  push: [
    { id: "seatpress", name: "Seated Dumbbell Shoulder Press", muscles: "Shoulders · Triceps", equip: "Dumbbells, bench",
      hi: ["arm"], dur: 2600, db: true, props: [["bench", 82, 140, 50, 40], ["pad", 99, 140, 99, 70, 8]],
      k: [{ h: [110, 134], s: [110, 82], a: [122, 73], f: [150, 180] },
          { h: [110, 134], s: [110, 82], a: [114, 29], f: [150, 180] }],
      steps: ["Sit tall with a dumbbell beside each shoulder, elbows under your wrists.", "Press up until your arms are straight overhead.", "Pause for a second at the top, then lower slowly to the start."],
      tip: "Keep your back against the pad and your ribs down.", mistake: "Flaring the elbows behind your body or arching your lower back." },
    { id: "inclinepress", name: "Dumbbell Incline Chest Press", muscles: "Upper chest · Front delts · Triceps", equip: "Dumbbells, incline bench",
      hi: ["arm"], dur: 2600, db: true, props: [["pad", 95, 148, 40, 109, 9], ["bench", 92, 148, 38, 32]],
      k: [{ h: [100, 140], s: [57.4, 110.4], a: [66, 100], f: [150, 180] },
          { h: [100, 140], s: [57.4, 110.4], a: [86, 67], f: [150, 180] }],
      steps: ["Lie back on an incline bench with dumbbells at the sides of your upper chest.", "Press up until your arms are extended.", "Lower your elbows slowly back to the start."],
      tip: "Plant your feet and pinch your shoulder blades together before the first rep.", mistake: "Clanking the weights together at the top. Stop just short." },
    { id: "skull", name: "Skull Crushers", muscles: "Triceps", equip: "Barbell or EZ bar, flat bench",
      hi: ["forearm"], dur: 2600, db: true, el: -1, kn: 1, props: [["bench", 58, 130, 120, 50]],
      k: [{ h: [100, 124], s: [152, 124], a: [156, 72], f: [64, 180] },
          { h: [100, 124], s: [152, 124], a: [176, 108], f: [64, 180] }],
      steps: ["Lie on a bench holding the bar over your collarbone, palms down, hands shoulder-width.", "Keep your upper arms still and bend your elbows to lower the bar just past your head.", "Hold 1–2 seconds, then straighten your arms to press it back up."],
      tip: "Your upper arm stays fixed. Only the forearms move.", mistake: "Elbows drifting out to the sides." },
    { id: "pushdown", name: "Cable Rope Triceps Pushdown", muscles: "Triceps", equip: "Cable machine, rope",
      hi: ["forearm"], dur: 2200, cable: [192, 22], props: [["col", 200, 10, 180]],
      k: [{ h: [110, 113], s: [113, 61], a: [136, 76], f: [110, 180] },
          { h: [110, 113], s: [113, 61], a: [122, 114], f: [110, 180] }],
      steps: ["Face a high pulley and grab the rope attachment.", "With elbows pinned to your sides, push your hands down until your arms are straight.", "Turn your palms down at the bottom, then let your forearms rise slowly."],
      tip: "Split the rope apart at the bottom for a harder squeeze.", mistake: "Leaning over the rope and using your body weight." },
    { id: "fly", name: "Incline Dumbbell Chest Fly", muscles: "Chest", equip: "Dumbbells, incline bench", front: true,
      hi: ["arm"], dur: 2800, db: true, props: [["rect", 98, 38, 44, 92]],
      k: [{ h: [120, 125], s: [120, 62], a: [58, 82], a2: [182, 82], f: [96, 180], f2: [144, 180] },
          { h: [120, 125], s: [120, 62], a: [114, 74], a2: [126, 74], f: [96, 180], f2: [144, 180] }],

          <text id="ringNum" x="110" y="120" text-anchor="middle">${fmt(wk.left)}</text><text class="sub" x="110" y="150" text-anchor="middle">${(wk.restLabel || P_().restLabel).toUpperCase()}</text></svg>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="ghost" type="button" data-act="add">+30 s</button><button class="ghost" type="button" data-act="skip">Skip rest</button></div>
        <p class="up-next">Up next: <b>${next ? next.name : "Finish"}</b>${next ? ` · set ${last ? 1 : wk.set} of ${next.sets}` : ""}</p>
      </div>`;
    if (next) { const s = mk("svg", { class: "stage fig", viewBox: "0 0 240 200" }); s.style.maxWidth = "220px"; s.style.margin = "4px auto 0"; w.querySelector(".rest").appendChild(s); figure(s, next); }
    wk.total = wk.left;
    timer = setInterval(() => {
      wk.left--; const num = $("ringNum"), arc = $("ringArc");
      if (num) num.textContent = fmt(Math.max(0, wk.left));
      if (arc) arc.setAttribute("stroke-dashoffset", C * (1 - Math.max(0, wk.left) / wk.total));
      if (wk.left <= 0) { try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} afterRest(); }
    }, 1000);
    return;
  }
  w.innerHTML = `${head}<svg class="stage fig" id="wkFig" viewBox="0 0 240 200"></svg>
    <div class="wk-name"></div>
    <div class="wk-sets">${setBars}</div>
    <div class="wk-reps"><b>${ex.reps}</b><span>${ex.light ? (ex.cooldown ? "cool-down · hold and breathe" : "warm-up · no rest after") : `${/^\d+(–\d+)?$/.test(ex.reps) ? "reps · " : ""}set ${wk.set} of ${ex.sets}`}</span></div>
    <p class="cue"></p>
    <div class="wk-row">
      <button class="start" type="button" data-act="done">Set done</button>
      ${ex.sets < 4 && !ex.light ? `<button class="ghost" type="button" data-act="extra">+1 set</button>` : ""}
    </div>`;
  w.querySelector(".wk-name").textContent = ex.name;
  w.querySelector(".cue").textContent = ex.tip;
  figure($("wkFig"), ex);
}
function afterRest() {
  clearInterval(timer);
  wk.resting = false;
  if (wk.set > wk.queue[wk.i].sets) { wk.i++; wk.set = 1; }
  renderWorkout();
}
$("wkWrap").addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act; if (!act) return;
  if (act === "close") return endWorkout();
  if (act === "extra") { wk.queue[wk.i].sets++; return renderWorkout(); }
  if (act === "done") {
    const ex = wk.queue[wk.i];
    wk.set++;
    if (wk.set > ex.sets) { done[ex.id] = true; save(); }
    if (wk.set > ex.sets && wk.i === wk.queue.length - 1) { wk.i++; return renderWorkout(); }
    if (!ex.rest) return afterRest();
    wk.resting = true; wk.left = ex.rest; wk.restLabel = ex.restLabel; renderWorkout();
  }
  if (act === "skip") afterRest();
  if (act === "add") { wk.left += 30; wk.total = Math.max(wk.total, wk.left); const n = $("ringNum"); if (n) n.textContent = fmt(wk.left); }
});
$("startBtn").addEventListener("click", () => startWorkout());
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("confirm").hidden) closeConfirm(); else if (wk) endWorkout(); else closeDetail(); } });

renderList();
})();
</script>
